<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>数独 — SiliconHuman Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#e1e4ed;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
h1{color:#8b5cf6;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:#1e2030;padding:4px;border-radius:8px;max-width:min(90vw,450px);width:100%}
.cell{aspect-ratio:1;background:#11131e;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;transition:background .15s;border-radius:2px;color:#e1e4ed}
.cell:hover{background:#1a1c2c}.cell.given{color:#8b5cf6}.cell.selected{background:#1f6feb33;box-shadow:inset 0 0 0 2px #3b82f6}.cell.error{color:#f85149}
.cell:nth-child(3n){border-right:2px solid #30363d}.cell:nth-child(9n){border-right:none}
.grid .cell:nth-child(n+19):nth-child(-n+27),.grid .cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #30363d}
.numbers{display:flex;gap:4px;max-width:min(90vw,450px);width:100%;justify-content:center}
.num{flex:1;aspect-ratio:1;max-width:44px;background:#161b22;border:1px solid #30363d;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;color:#e1e4ed}
.num:hover{background:#1f6feb33;border-color:#3b82f6}
.num.used{opacity:.3}
button{background:#238636;border:none;color:#fff;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
</style></head><body>
<h1>🧩 数独</h1>
<div class="grid" id="grid"></div>
<div class="numbers" id="nums"></div>
<button onclick="newGame()">🔄 New Puzzle</button>
<script>
let puzzle=[],solution=[],selected=null;
const PUZZLES=[
  '530070000600195000098000060800060003400803001700020006060000280000419005000080079',
  '000075400000000008080100920008200003000030001093004050900001300060000045100968000',
];
function newGame(){
  let s=PUZZLES[Math.floor(Math.random()*PUZZLES.length)];
  puzzle=[];solution=[];
  for(let i=0;i<81;i++)puzzle.push(s[i]==='0'?0:parseInt(s[i]));
  render();selected=null;
}
function render(){
  let g=document.getElementById('grid');g.innerHTML='';
  for(let i=0;i<81;i++){
    let c=document.createElement('div');c.className='cell';c.textContent=puzzle[i]||'';
    if(puzzle[i])c.classList.add('given');
    if(i===selected)c.classList.add('selected');
    c.onclick=()=>{selected=i;render()};
    g.appendChild(c);
  }
  let n=document.getElementById('nums');n.innerHTML='';
  for(let d=1;d<=9;d++){
    let b=document.createElement('div');b.className='num';b.textContent=d;
    if(puzzle.filter(v=>v===d).length>=9)b.classList.add('used');
    b.onclick=()=>{if(selected!==null&&!document.querySelectorAll('.cell')[selected].classList.contains('given')){puzzle[selected]=d;render()}};
    n.appendChild(b);
  }
}
newGame();
</script></body></html>
