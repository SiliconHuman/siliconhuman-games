<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>五子棋 — SiliconHuman Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e1e4ed;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
h1{color:#f0883e;font-size:24px}
.board{display:grid;grid-template-columns:repeat(15,1fr);gap:1px;background:#1e2030;padding:8px;border-radius:12px;max-width:min(90vw,500px);width:100%}
.cell{aspect-ratio:1;background:#11131e;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .15s}
.cell:hover{background:#1a1c2c}
.cell.black{color:#e1e4ed}.cell.white{color:#3fb950}
.cell.black::after{content:'●';font-size:24px}.cell.white::after{content:'●';font-size:24px}
.status{font-size:16px;color:#8b949e}
button{background:#238636;border:none;color:#fff;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
</style></head><body>
<h1>⚫ 五子棋</h1>
<div class="status" id="status">黑棋先行</div>
<div class="board" id="board"></div>
<button onclick="reset()">🔄 New Game</button>
<script>
let board=Array(15).fill().map(()=>Array(15).fill(0)),turn=1,gameOver=false;
function render(){
  let b=document.getElementById('board');b.innerHTML='';
  for(let r=0;r<15;r++)for(let c=0;c<15;c++){
    let cell=document.createElement('div');cell.className='cell';
    if(board[r][c]===1)cell.classList.add('black');
    if(board[r][c]===2)cell.classList.add('white');
    cell.onclick=()=>move(r,c);b.appendChild(cell);
  }
}
function move(r,c){
  if(gameOver||board[r][c]!==0)return;
  board[r][c]=turn;
  if(checkWin(r,c,turn)){gameOver=true;document.getElementById('status').textContent=(turn===1?'⚫ Black':'⚪ White')+' wins! 🎉';render();return}
  turn=turn===1?2:1;
  document.getElementById('status').textContent=(turn===1?'⚫ Black':'⚪ White')+' turn';
  render();
}
function checkWin(r,c,p){
  let dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let[dr,dc]of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){let nr=r+dr*i,nc=c+dc*i;if(nr>=0&&nr<15&&nc>=0&&nc<15&&board[nr][nc]===p)cnt++;else break}
    for(let i=1;i<5;i++){let nr=r-dr*i,nc=c-dc*i;if(nr>=0&&nr<15&&nc>=0&&nc<15&&board[nr][nc]===p)cnt++;else break}
    if(cnt>=5)return true;
  }
  return false;
}
function reset(){board=Array(15).fill().map(()=>Array(15).fill(0));turn=1;gameOver=false;document.getElementById('status').textContent='⚫ Black turn';render()}
render();
</script></body></html>
