<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Memory Match — SiliconHuman Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050508;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;font-family:-apple-system,sans-serif}
h1{color:#8b5cf6;font-size:28px}.info{color:#e1e4ed;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:min(90vw,400px);width:100%}
.card{aspect-ratio:1;background:#161b22;border:2px solid #30363d;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;transition:all .2s;user-select:none}
.card:hover{border-color:#8b5cf6}.card.flipped{background:#1a1a2e;border-color:#8b5cf6}.card.matched{background:#1a3a1a;border-color:#22c55e;pointer-events:none}
button{background:#238636;border:none;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
</style></head><body>
<h1>🧠 Memory Match</h1><div class="info">Moves: <b id="moves">0</b> · Pairs: <b id="pairs">0</b>/8</div>
<div class="grid" id="grid"></div><button onclick="newGame()">🔄 New Game</button>
<script>
let icons=['🐶','🐱','🐼','🐨','🦊','🐰','🐸','🦄'],cards=[],flipped=[],matched=[],moves=0,lock=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
  cards=shuffle([...icons,...icons]);flipped=[];matched=[];moves=0;lock=false;
  document.getElementById('moves').textContent=0;document.getElementById('pairs').textContent=0;
  let g=document.getElementById('grid');g.innerHTML='';
  cards.forEach((icon,i)=>{
    let c=document.createElement('div');c.className='card';c.textContent='?';c.onclick=()=>flip(i);
    g.appendChild(c)
  })
}
function flip(i){
  if(lock||flipped.includes(i)||matched.includes(i)||flipped.length>=2)return;
  flipped.push(i);updateCard(i,icons[i]);
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;
    if(cards[flipped[0]]===cards[flipped[1]]){
      matched.push(flipped[0],flipped[1]);
      document.getElementById('pairs').textContent=matched.length/2;
      flipped.forEach(j=>document.querySelectorAll('.card')[j].classList.add('matched'));
      flipped=[]
    }else{lock=true;setTimeout(()=>{flipped.forEach(j=>updateCard(j,'?'));flipped=[];lock=false},800)}
  }
}
function updateCard(i,t){let c=document.querySelectorAll('.card')[i];c.textContent=t;if(t!=='?')c.classList.add('flipped');else c.classList.remove('flipped')}
newGame();
</script></body></html>
