<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake — SiliconHuman Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050508;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;font-family:-apple-system,sans-serif;overflow:hidden}
h1{color:#22c55e;font-size:28px}.score{color:#e1e4ed;font-size:18px}.score b{color:#22c55e}
canvas{border:2px solid #1e2030;border-radius:12px;background:#0d1117;max-width:min(90vw,400px)}
.controls{display:grid;grid-template-columns:repeat(3,60px);gap:4px;margin-top:8px}
.ctrl{width:60px;height:60px;background:#161b22;border:1px solid #30363d;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;color:#e1e4ed;user-select:none}.ctrl:active{background:#1f6feb33}
.btn{background:#238636;border:none;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
</style></head><body>
<h1>🐍 Snake</h1><div class="score">Score: <b id="score">0</b> · Best: <b id="best">0</b></div>
<canvas id="c" width="400" height="400"></canvas>
<div class="controls" style="grid-template-areas:'. up .''left . right''. down .'">
<button class="ctrl" style="grid-area:up" onclick="changeDir(0,-1)">↑</button>
<button class="ctrl" style="grid-area:left" onclick="changeDir(-1,0)">←</button>
<button class="ctrl" style="grid-area:right" onclick="changeDir(1,0)">→</button>
<button class="ctrl" style="grid-area:down" onclick="changeDir(0,1)">↓</button></div>
<button class="btn" onclick="reset()">🔄 New Game</button>
<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let snake=[{x:10,y:10}],dir={x:1,y:0},food={},score=0,best=parseInt(localStorage.getItem('snake_best')||'0'),gameOver=false,speed=100,timer;
function spawnFood(){do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function changeDir(dx,dy){if((dx&&dir.x)||(dy&&dir.y))return;dir={x:dx,y:dy}}
function step(){
  if(gameOver)return;
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver=true;clearInterval(timer);draw();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=10;spawnFood()}else{snake.pop()}
  draw()
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,400,400);
  snake.forEach((s,i)=>{let a=1-i/snake.length*.5;ctx.fillStyle='rgba(34,197,94,'+a+')';ctx.fillRect(s.x*20+1,s.y*20+1,18,18)})
  ctx.fillStyle='#f85149';ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff6666';ctx.beginPath();ctx.arc(food.x*20+8,food.y*20+7,3,0,Math.PI*2);ctx.fill();
  if(gameOver){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,400,400);ctx.fillStyle='#f85149';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over',200,200);ctx.fillStyle='#e1e4ed';ctx.font='16px sans-serif';ctx.fillText('Score: '+score,200,230)}
  document.getElementById('score').textContent=score;
  if(score>best){best=score;localStorage.setItem('snake_best',best)}document.getElementById('best').textContent=best
}
function reset(){snake=[{x:10,y:10}];dir={x:1,y:0};score=0;gameOver=false;clearInterval(timer);spawnFood();timer=setInterval(step,speed);draw()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')changeDir(0,-1);if(e.key==='ArrowDown')changeDir(0,1);if(e.key==='ArrowLeft')changeDir(-1,0);if(e.key==='ArrowRight')changeDir(1,0)});
spawnFood();timer=setInterval(step,speed);draw();
</script></body></html>
